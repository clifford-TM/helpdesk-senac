<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HelpDesk - Configurações</title>

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <header class="topo">
      <div class="logo">HELPDESK</div>

      <div class="busca-topo">
        <input type="text" placeholder="Buscar chamados" />
      </div>

      <div class="usuario">
        <div class="icone-usuario">●</div>
        <span>Usuário</span>
      </div>
    </header>

    <div class="layout">
      <nav class="menu-lateral">
        <a th:href="@{/}"> 🏠 Início </a>

        <a th:href="@{/novo-chamado}"> 🎫 Novo Chamado </a>

        <a th:href="@{/equipe}"> 👥 Equipe </a>

        <a th:href="@{/relatorios}"> 📊 Relatórios </a>

        <a th:href="@{/configuracoes}" class="ativo"> ⚙ Configurações </a>
      </nav>

      <main class="conteudo">
        <section class="cabecalho-pagina">
          <h1>CONFIGURAÇÕES</h1>
          <p>Categorias disponíveis para os chamados.</p>
        </section>

        <section class="painel">
          <div class="painel-titulo">
            <h2>Categorias</h2>
          </div>

          <div class="tabela-container">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nome</th>
                </tr>
              </thead>

              <tbody>
                <tr th:each="categoria : ${categorias}">
                  <td th:text="${categoria.id}">1</td>

                  <td th:text="${categoria.nome}">Hardware</td>
                </tr>

                <tr th:if="${#lists.isEmpty(categorias)}">
                  <td colspan="2">Nenhuma categoria cadastrada.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script th:src="@{/js/script.js}"></script>
  </body>
</html>
